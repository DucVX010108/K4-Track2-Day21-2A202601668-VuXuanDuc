name: Income Model CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Huan luyen mo hinh, kiem tra ket qua, upload artifact.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          if [ -n "${{ secrets.STORAGE_CREDENTIALS }}" ] && [ "${{ secrets.STORAGE_CREDENTIALS }}" != "{}" ]; then
            echo '${{ secrets.STORAGE_CREDENTIALS }}' > /tmp/sa-key.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
          fi

      - name: Pull data with DVC
        run: |
          python - <<'PYEOF'
          import os, urllib.request, yaml
          os.makedirs("data", exist_ok=True)
          for dvc_file in ["data/train_batch1.csv.dvc", "data/holdout.csv.dvc"]:
              if os.path.exists(dvc_file):
                  with open(dvc_file) as f:
                      meta = yaml.safe_load(f)
                  out = meta["outs"][0]
                  md5 = out["md5"]
                  csv_path = os.path.join(os.path.dirname(dvc_file), out["path"])
                  url = f"https://storage.googleapis.com/track2-d21-2a202601668/dvc/files/md5/{md5[:2]}/{md5[2:]}"
                  print(f"Pulling {csv_path} from DVC remote storage ({url})...")
                  urllib.request.urlretrieve(url, csv_path)
                  print(f"Successfully pulled {csv_path} ({os.path.getsize(csv_path)} bytes)")
          PYEOF

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          bucket_name = os.environ.get("ARTIFACT_BUCKET")
          if os.path.exists("/tmp/sa-key.json") and bucket_name:
              try:
                  from google.cloud import storage
                  client = storage.Client()
                  bucket = client.bucket(bucket_name)
                  blob = bucket.blob("artifacts/current/model.joblib")
                  blob.upload_from_filename("models/model.joblib")
                  print("Model uploaded to Cloud Storage.")
              except Exception as e:
                  print(f"Warning: Cloud Storage upload skipped: {e}")
          else:
              print("Model saved for release job deployment.")
          PYEOF

      - name: Save model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/model.joblib

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Tiep tuc trien khai.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: models

      - name: Copy new model to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "models/model.joblib"
          target: "/home/${{ secrets.SERVER_USER }}/models/"
          strip_components: 1

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
